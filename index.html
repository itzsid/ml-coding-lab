<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ML Coding Lab has moved to ML Grind</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://mlgrind.github.io/">
  <meta http-equiv="refresh" content="3; url=https://mlgrind.github.io/">
  <script>
    // ML Coding Lab moved to https://mlgrind.github.io/. Keep the page path:
    //   /ml-coding-lab/problem/a/b        -> https://mlgrind.github.io/problem/a/b
    //   /ml-coding-lab/?/problem/a/b      -> same (old SPA 404 redirect format)
    (function () {
      var l = window.location;
      var path = l.pathname.replace(/^\/ml-coding-lab/, '') || '/';
      var search = l.search;
      if (search.indexOf('?/') === 0) {
        var parts = search.slice(2).split('&').map(function (s) { return s.replace(/~and~/g, '&'); });
        path = '/' + parts[0];
        search = parts.length > 1 ? '?' + parts.slice(1).join('&') : '';
      }
      if (path.slice(-11) === '/index.html') path = path.slice(0, -10);
      l.replace('https://mlgrind.github.io' + path + search + l.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #e6e8ee;
           font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; padding: 16px; box-sizing: border-box; }
    a { color: #a78bfa; }
    @media (prefers-color-scheme: light) { body { background: #f8fafc; color: #111827; } a { color: #6d28d9; } }
  </style>
</head>
<body>
  <main>
    <h1>ML Coding Lab is now ML Grind</h1>
    <p>This site has moved to <a href="https://mlgrind.github.io/">mlgrind.github.io</a>. Redirecting…</p>
    <p>Your saved progress lives in your browser per site, so it won't carry over automatically.</p>
  </main>
</body>
</html>
